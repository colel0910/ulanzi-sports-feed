name: Refresh compact sports scores
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update public JSON feeds
        run: python update_scores.py
      - name: Commit updated feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh sports score feeds'
            git push
          fi
